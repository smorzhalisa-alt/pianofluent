<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PianoFluent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app">
    <header class="topbar glass" id="topbar">
      <div class="brand">
        <div class="brand-mark">P</div>
        <h1>PianoFluent</h1>
      </div>
      <div class="topbar-right">
        <span class="conn-status" id="connStatus">No piano</span>
        <button class="btn-ghost" id="navConnect" hidden>Devices</button>
        <button class="btn-ghost" id="navHome" hidden>Home</button>
      </div>
    </header>

    <main id="view"></main>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
